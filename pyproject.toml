[project]
name = "recsys-hw1-goodreads"
version = "1.0.0"
description = "Пять рекомендательных моделей с нуля на Goodreads Poetry: ItemKNN, iALS, EASE, FM, iALS с собственным таргетом"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "polars>=1.20",
    "pyarrow>=17",
    "pandas>=2.2",
    "torch>=2.4",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
